name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC): no stored token; provenance is signed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag. Without the
          # full history and tags a checkout resolves to 0.0.1.dev...+unknown,
          # which makes `--version` meaningless and any version assertion fail.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or newer (trusted publishing)
        run: npm install -g npm@^11.5.1

      # npm publishes the literal in package.json, so a tag cut without a manual
      # bump either failed with E403 (version exists) or shipped the wrong number.
      # v0.1.9 was tagged while package.json still said 0.1.7. Take the version
      # from the tag so npm and PyPI cannot diverge again.
      - name: Sync package.json version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
