[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "skseed"
# Derived from the git tag by setuptools-scm, NOT written here. A hardcoded
# version here equals the newest release on PyPI, so the next tag rebuilds an
# already-published version and upload fails with a bare 400. That is exactly
# how sksecurity lost two months of releases.
dynamic = ["version"]
description = "Sovereign Logic Kernel — Aristotelian entelechy engine for truth alignment"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "smilinTux.org", email = "hello@smilintux.org"},
    {name = "neuresthetics"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.0,<9.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
memory = [
    "skmemory>=0.5.0",
]
skcapstone = ["skcapstone>=0.6.8"]
dev = [
    "pytest>=7.0",
    # PINNED EXACTLY, not ranged. An unbounded `ruff>=0.1` let a minor release
    # change the rule set under CI and turn a green gate red on its own; the
    # follow-up `ruff>=0.15,<0.17` narrowed that but did not close it, because
    # ruff adds new rules to existing prefixes in patch releases and this repo
    # selects whole prefixes (S, PLW, UP, PIE, C4). Any unreleased 0.16.x could
    # therefore still redden the gate with no change to this repo. An exact pin
    # makes `ruff check` reproducible: the same commit lints the same way today
    # and in six months. Bumping it is a deliberate, reviewable commit.
    # [tool.ruff.lint] pins the rules; this pins the engine that reads them.
    # Guarded by a docs-evidence check in SOP.md so the pin cannot silently
    # loosen back into a range.
    "ruff==0.16.3",
    "black>=23.0",
]

[project.scripts]
skseed = "skseed.cli:main"

[project.urls]
Homepage = "https://github.com/smilinTux/skseed"
Repository = "https://github.com/smilinTux/skseed"
Issues = "https://github.com/smilinTux/skseed/issues"
"Original Seed Framework" = "https://github.com/neuresthetics/seed"

[tool.setuptools.packages.find]
include = ["skseed*"]

[tool.setuptools.package-data]
skseed = ["data/*.json", "data/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
# Selected EXPLICITLY on purpose. With no config, `ruff check` uses ruff's own
# default rule set, which is not stable across releases: the dev extra asked
# for `ruff>=0.1`, so CI silently picked up 0.16, whose defaults added UP/BLE.
# The gate went from passing to 59 errors, then to 73, with no change to this
# repo. An explicit select makes the gate a property of the repo instead.
# Verified 2026-08-16 against this select: ruff 0.15.0, 0.15.10, 0.15.22,
# 0.16.0, 0.16.1, 0.16.2 and 0.16.3 all report 0 findings on skseed/, so the
# rule set is now a property of this file rather than of the installed engine.
select = [
    "E4", "E7", "E9",  # pycodestyle (ruff's own default subset)
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade — requires-python is >=3.10
    "BLE",             # blind except
    "S",               # bandit
    "PIE",
    "C4",              # comprehensions
    "PLW",             # pylint warnings
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and throwaway credentials.
"tests/*" = ["S101", "S105", "S106"]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools_scm]
# Generated at build time and gitignored: it is rewritten on every build, so
# a committed copy only goes stale.
version_file = "skseed/_version.py"
fallback_version = "0.0.0+unknown"
